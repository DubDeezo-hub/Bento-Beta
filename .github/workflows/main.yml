name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Lets the build publish the finished APK on the repository's Releases page
permissions:
  contents: write

jobs:
  build:
    # Pinned so a change of the "latest" image (Ubuntu 26 from 19 October 2026) cannot break the build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        # A failed build puts the compiler's errors on the run page, so they can be read without opening the log
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            msg="$(grep -E '^e: |error:|What went wrong' -A3 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Build failed::${msg:-see the log}"
            exit 1
          fi

      - name: Name the APK after its build number
        run: cp app/build/outputs/apk/debug/app-debug.apk "Bento-1.${{ github.run_number }}.apk"

      # Kept as a backup download (Actions tab > the run > Artifacts)
      - uses: actions/upload-artifact@v6
        with:
          name: bento-debug-apk
          path: Bento-1.${{ github.run_number }}.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          APK="Bento-1.${{ github.run_number }}.apk"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "$APK" --repo "$REPO" --target "${{ github.sha }}" \
              --title "Bento 1.${{ github.run_number }}" \
              --notes "Build ${{ github.run_number }}. Download the .apk below and install it over the previous version."
          fi