name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Lets the build publish the finished APK on the repository's Releases page
permissions:
  contents: write

jobs:
  build:
    # Pinned so a change of the "latest" image (Ubuntu 26 from 19 October 2026) cannot break the build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Run the unit tests
        # The logic that needs no phone (firmware, store lists, game updates, package checks, etaHEN settings, memory
        # text search, languages) and the debugger client against the practice console. Failures show on the run page.
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest --no-daemon 2>&1 | tee unit.log; then
            msg="$(grep -E ' FAILED$|^e: |What went wrong' -A3 unit.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Unit tests failed::${msg:-see the log}"
            exit 1
          fi

      - name: Show the unit test results on the run page
        if: always()
        run: python3 .github/scripts/unit_summary.py app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        # A failed build puts the compiler's errors on the run page, so they can be read without opening the log
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            msg="$(grep -E '^e: |error:|What went wrong' -A3 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Build failed::${msg:-see the log}"
            exit 1
          fi

      - name: Name the APK after its build number
        # The old name too: versions from before the rename look for Bento-<version>.apk when GitHub's API is busy
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Crimson-Multitool-1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "Bento-1.${{ github.run_number }}.apk"

      # Kept as a backup download (Actions tab > the run > Artifacts)
      - uses: actions/upload-artifact@v6
        with:
          name: crimson-multitool-debug-apk
          path: Crimson-Multitool-1.${{ github.run_number }}.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          APK="Crimson-Multitool-1.${{ github.run_number }}.apk"
          OLD_NAME="Bento-1.${{ github.run_number }}.apk"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$OLD_NAME" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "$APK" "$OLD_NAME" --repo "$REPO" --target "${{ github.sha }}" \
              --title "Crimson Multitool 1.${{ github.run_number }}" \
              --notes "Build ${{ github.run_number }}. Download the .apk below and install it over the previous version."
          fi