name: Phone test

# Builds the app and runs it on a virtual Android phone: installs it over the previous release, opens every tab,
# turns the screen, leaves and comes back, and switches through all the languages. It only reads from the repository;
# the APK that gets published on the Releases page is still made by "Build APK" (main.yml).
#
# What happened is on the run's page: the summary (a table of every check) and, if something failed, the annotations.
# Screenshots and the phone's log are under Artifacts ("phone-test-results").

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**', '!compat-data']
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: phone-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone:
    # Pinned: the emulator needs a known machine image (the "latest" label is about to move to a new Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Check the translations
        # Every language against English: missing keys, %1$s blanks that differ, unescaped apostrophes
        run: python3 .github/scripts/check_strings.py

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Run the unit tests
        # The logic that needs no phone (firmware, store lists, game updates, package checks, etaHEN settings, memory
        # text search, languages) and the debugger client against the practice console. Failures show on the run page.
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest --no-daemon 2>&1 | tee unit.log; then
            msg="$(grep -E ' FAILED$|^e: |What went wrong' -A3 unit.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Unit tests failed::${msg:-see the log}"
            exit 1
          fi

      - name: Show the unit test results on the run page
        if: always()
        run: python3 .github/scripts/unit_summary.py app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"

      - name: Check the code with Android Lint
        # An error stops the run; warnings are only listed. Either way the findings are on the run page, in this
        # step's log, and in the results download
        run: |
          set +e
          gradle lintDebug --no-daemon > lint.log 2>&1
          status=$?
          python3 .github/scripts/lint_summary.py app/build/reports/lint-results-debug.xml | tee -a "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            echo "::error title=Lint found errors::$(grep -E 'Error:|errors,' lint.log | head -20 | tr '\n' ' ' | sed 's/%/%25/g')"
            tail -40 lint.log
            exit 1
          fi

      - name: Build the debug APK
        # A failed build puts the compiler's errors on the run page, so they can be read without opening the log
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            msg="$(grep -E '^e: |error:|What went wrong' -A3 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Build failed::${msg:-see the log}"
            exit 1
          fi

      # To test updating: the two newest releases, installed one over the other like you do on your phone
      - name: Get the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p prev/old prev/new
          TAGS="$(gh release list --limit 2 --json tagName --jq '.[].tagName' || true)"
          echo "Releases found: $(echo $TAGS)"
          NEWEST="$(echo "$TAGS" | sed -n 1p)"
          OLDER="$(echo "$TAGS" | sed -n 2p)"
          if [ -n "$NEWEST" ] && [ -n "$OLDER" ]; then
            gh release download "$NEWEST" --pattern '*.apk' --dir prev/new || true
            gh release download "$OLDER" --pattern '*.apk' --dir prev/old || true
          fi
          echo "NEW_APK=$(ls "$PWD"/prev/new/*.apk 2> /dev/null | head -1)" >> "$GITHUB_ENV"
          echo "OLD_APK=$(ls "$PWD"/prev/old/*.apk 2> /dev/null | head -1)" >> "$GITHUB_ENV"
          echo "LATEST_RELEASE_NUMBER=$(echo "$NEWEST" | sed -E 's/.*[^0-9]([0-9]+)$/\1/')" >> "$GITHUB_ENV"

      # The virtual phone needs hardware acceleration, which the build machine only allows once this is set
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A pretend console on this machine (fake_console.py), so the phone test can use the app for real: browse files,
      # send a package link to the installer, connect the debugger. The emulator reaches this machine at 10.0.2.2.
      - name: Start the pretend console
        run: |
          python3 -m pip install --quiet --user --break-system-packages pyftpdlib || sudo apt-get install -y -qq python3-pyftpdlib
          mkdir -p ui-test-results
          FAKE_FTP_ADDRESS=10.0.2.2 nohup python3 -u fake_console.py > ui-test-results/fake-console.log 2>&1 &
          sleep 3
          cat ui-test-results/fake-console.log

      - name: Run the app on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FAKE_CONSOLE_LOG: ${{ github.workspace }}/ui-test-results/fake-console.log
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui_smoke.sh app/build/outputs/apk/debug/app-debug.apk ui-test-results

      - name: Show the results on the run page
        if: always()
        run: |
          if [ -f ui-test-results/summary.md ]; then cat ui-test-results/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "The phone test did not get as far as writing results." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the screenshots and the phone's log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phone-test-results
          path: |
            ui-test-results
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # The build this run tested, to install on a phone and try before it goes out to everyone (signed like a release,
      # so it installs over the app). It is the APK inside the zip GitHub hands out.
      - name: Keep the tested app
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: ignore
