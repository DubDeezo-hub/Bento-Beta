name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Lets the build publish the finished APK on the repository's Releases page
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Unpack project
        run: unzip -q pssender-project.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Name the APK after its build number
        run: cp project/app/build/outputs/apk/debug/app-debug.apk "PS5-Sender-1.${{ github.run_number }}.apk"

      # Kept as a backup download (Actions tab > the run > Artifacts)
      - uses: actions/upload-artifact@v4
        with:
          name: pssender-debug-apk
          path: PS5-Sender-1.${{ github.run_number }}.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          APK="PS5-Sender-1.${{ github.run_number }}.apk"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "$APK" --repo "$REPO" --target "${{ github.sha }}" \
              --title "PS5 Sender 1.${{ github.run_number }}" \
              --notes "Build ${{ github.run_number }}. Download the .apk below and install it over the previous version."
          fi
